<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }
    h1 {
      color: #333;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 15px;
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <h1>Welcome back, <span id="username"></span>!</h1>

  <textarea id="userNote" placeholder="Write something..."></textarea>
  <br><br>
  <button onclick="saveNote()">Save Note</button>
  <p id="status"></p>

  <h3>Your Saved Note:</h3>
  <p id="savedNote"></p>

  <br><br>
  <button onclick="logout()">Logout</button>

  <script src="{% static 'js/auth.js' %}"></script>
  <script src="{% static 'js/user-data.js' %}"></script>
</body>
</html>
