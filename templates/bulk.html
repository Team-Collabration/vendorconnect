<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulk Orders</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Poppins", sans-serif;
  background: linear-gradient(135deg, beige 0%, rgb(225, 237, 246) 100%);
  min-height: 100vh;
  display: flex;
}

/* Sidebar */
.sidebar {
  height: 100vh;
  width: 260px;
  background-color: #2c3e50;
  display: flex;
  flex-direction: column;
  padding: 30px 0;
  position: fixed;
  box-shadow: 4px 0 15px rgba(0,0,0,0.2);
  z-index: 1000;
}

.sidebar-header {
  padding: 0 20px 30px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 20px;
}

.sidebar-header h2 {
  color: #fff;
  font-size: 1.4em;
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-header h2 i { color: #3498db; }

.sidebar a {
  display: flex;
  align-items: center;
  padding: 15px 25px;
  text-decoration: none;
  color: #ecf0f1;
  font-weight: 500;
  margin: 5px 15px;
  border-radius: 8px;
  transition: all 0.3s ease;
}

.sidebar a i { margin-right: 12px; min-width: 20px; text-align: center; font-size: 1.1em; }

.sidebar a:hover { background-color: rgba(52, 152, 219, 0.2); transform: translateX(5px); }

.sidebar a.active { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4); }

/* Main Content */
.main-content { margin-left: 260px; width: calc(100% - 260px); padding: 30px; }

/* Header */
header { background: #fff; color: #2c3e50; padding: 25px 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-bottom: 30px; }

header h1 { font-size: 2em; display: flex; align-items: center; gap: 15px; margin: 0; }
header h1 i { color: #f39c12; }

/* Container */
.container { background: #fff; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 30px; }

/* Form */
form label { font-weight: 600; display: block; margin: 15px 0 5px; }
form input, form select, form textarea {
  width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 15px; font-size: 1rem;
}
textarea { resize: vertical; }

.cta-button {
  padding: 12px 25px; font-size: 1rem; background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
  color: white; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px;
  transition: all 0.3s ease;
}
.cta-button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3); }

@media (max-width: 1024px) {
  .sidebar { width: 220px; }
  .main-content { margin-left: 220px; width: calc(100% - 220px); }
}
@media (max-width: 768px) {
  .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; overflow-x: auto; padding: 15px 0; }
  .sidebar-header { display: none; }
  .sidebar a { margin: 0 10px; white-space: nowrap; }
  .main-content { margin-left: 0; width: 100%; padding: 20px; }
}
</style>
</head>
<body>

<!-- Vertical Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <h2><i class="fas fa-store"></i> Vendor Portal</h2>
  </div>
  <a href="{% url 'findsuppliers' %}" class="{% if request.resolver_match.url_name == 'findsuppliers' %}active{% endif %}"><i class="fas fa-search"></i> Find Suppliers</a>
  <a href="{% url 'compareprices' %}" class="{% if request.resolver_match.url_name == 'compareprices' %}active{% endif %}"><i class="fas fa-balance-scale"></i> Compare Prices</a>
  <a href="{% url 'bulk' %}" class="{% if request.resolver_match.url_name == 'bulk' %}active{% endif %}"><i class="fas fa-boxes"></i> Bulk Orders</a>
  <a href="{% url 'leavereviews' %}" class="{% if request.resolver_match.url_name == 'leavereviews' %}active{% endif %}"><i class="fas fa-star"></i> Reviews</a>
   <a href="{% url 'orders' %}" class="nav-link"><i class="fas fa-clipboard-list"></i> My Orders</a>
</div>

<!-- Main Content -->
<div class="main-content">
  <header>
    <h1><i class="fas fa-boxes"></i> Place Bulk Orders</h1>
  </header>

  <div class="container">
    <form method="post" action="{% url 'place_bulk_order' %}">
      {% csrf_token %}
      <label for="product">Select Product:</label>
      <select id="product" name="product" required>
        <option value="">-- Choose a product --</option>
        <option value="rice">Rice (50kg Bag)</option>
        <option value="wheat">Wheat Flour (25kg Bag)</option>
        <option value="oil">Cooking Oil (15L Can)</option>
        <option value="sugar">Sugar (50kg Bag)</option>
      </select>

      <label for="quantity">Quantity (Units):</label>
      <input type="number" id="quantity" name="quantity" min="1" required>
      <label for="supplier">Preferred Supplier:</label>
      <input type="text" id="supplier" name="supplier" placeholder="Enter supplier name ">
      <label for="instructions">Special Instructions:</label>
      <textarea id="instructions" name="instructions" rows="4" placeholder="Any delivery or packaging preferences?"></textarea>

      <button type="submit" class="cta-button"><i class="fas fa-paper-plane"></i> Submit Bulk Order</button>
    </form>
  </div>
</div>

</body>
</html>
