<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leave Reviews</title>
{% load static %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    background-color: #f5f5dc;
}

/* Sidebar */
.sidebar {
    height: 100vh;
    width: 260px;
    background-color: #2c3e50;
    display: flex;
    flex-direction: column;
    padding: 30px 0;
    position: fixed;
    box-shadow: 4px 0 15px rgba(0,0,0,0.2);
    z-index: 1000;
}

.sidebar-header {
    padding: 0 20px 30px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 20px;
}

.sidebar-header h2 {
    color: #fff;
    font-size: 1.4em;
    display: flex;
    align-items: center;
    gap: 10px;
}

.sidebar-header h2 i {
    color: #3498db;
}

.sidebar a {
    display: flex;
    align-items: center;
    padding: 15px 25px;
    text-decoration: none;
    color: #ecf0f1;
    font-weight: 500;
    margin: 5px 15px;
    border-radius: 8px;
    transition: all 0.3s ease;
}

.sidebar a i {
    margin-right: 12px;
    min-width: 20px;
    text-align: center;
    font-size: 1.1em;
}

.sidebar a:hover {
    background-color: rgba(52, 152, 219, 0.2);
    transform: translateX(5px);
}

.sidebar a.active {
    background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
    box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
}

/* Main Content */
.main-content {
    margin-left: 260px;
    width: calc(100% - 260px);
    padding: 30px;
}

/* Container */
.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 40px;
    background-color: #fff8e1;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
}

/* Icons and text */
.icon {
    text-align: center;
    font-size: 40px;
    color: #4d5b7f;
    margin-bottom: 10px;
}

h1 {
    text-align: center;
    color: #2d3a6f;
    margin-bottom: 15px;
}

p {
    text-align: center;
    font-size: 1.1rem;
    color: #555;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    font-weight: bold;
    color: #333;
    display: block;
    margin-bottom: 8px;
}

.input-icon {
    position: relative;
}

.input-icon i {
    position: absolute;
    top: 12px;
    left: 12px;
    color: #2d3a6f;
}

input[type="text"],
select,
textarea {
    width: 100%;
    padding: 10px 10px 10px 36px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 1rem;
    background-color: #fffaf0;
}

textarea {
    resize: vertical;
    height: 120px;
}

.submit-button {
    width: 100%;
    background-color: #6c82d7;
    color: white;
    border: none;
    padding: 12px 0;
    font-size: 1rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.submit-button i {
    margin-right: 8px;
}

.submit-button:hover {
    background-color: #2126b0;
}

.success-message {
    display: none;
    text-align: center;
    color: green;
    margin-top: 20px;
}

/* Responsive */
@media (max-width: 768px) {
    .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        flex-direction: row;
        overflow-x: auto;
        padding: 15px 0;
    }

    .sidebar-header {
        display: none;
    }

    .sidebar a {
        margin: 0 10px;
        white-space: nowrap;
    }

    .main-content {
        margin-left: 0;
        width: 100%;
        padding: 20px;
    }

    .container {
        width: 90%;
        padding: 20px;
    }
}
</style>
</head>
<body>

<!-- Vertical Sidebar Navbar -->
<div class="sidebar">
  <div class="sidebar-header">
    <h2><i class="fas fa-store"></i> Vendor Portal</h2>
  </div>
  <a href="{% url 'findsuppliers' %}" class="{% if request.resolver_match.url_name == 'findsuppliers' %}active{% endif %}">
    <i class="fas fa-search"></i> Find Suppliers
  </a>
  <a href="{% url 'compareprices' %}" class="{% if request.resolver_match.url_name == 'compareprices' %}active{% endif %}">
    <i class="fas fa-balance-scale"></i> Compare Prices
  </a>
  <a href="{% url 'bulk' %}" class="{% if request.resolver_match.url_name == 'bulk' %}active{% endif %}">
    <i class="fas fa-boxes"></i> Bulk Orders
  </a>
  <a href="{% url 'leavereviews' %}" class="{% if request.resolver_match.url_name == 'leavereviews' %}active{% endif %}">
    <i class="fas fa-star"></i> Reviews
  </a>
   <a href="{% url 'orders' %}" class="nav-link"><i class="fas fa-clipboard-list"></i> My Orders</a> 
</div>

<div class="main-content">
<div class="container">
    <div class="icon">
        <i class="fas fa-star-half-alt"></i>
    </div>
    <h1>Leave Reviews for Suppliers</h1>
    <p><i class="fas fa-comments"></i> Help build a reputation system by sharing your feedback.</p>

    <form id="reviewForm">
        <div class="form-group">
            <label for="supplier">Select Supplier:</label>
            <div class="input-icon">
                <i class="fas fa-store"></i>
                <select id="supplier" required>
                    <option value="">-- Choose Supplier --</option>
                    <option>Green Basket</option>
                    <option>Green Valley</option>
                    <option>Harvest Hub</option>
                    <option>Daily Fresh</option>
                    <option>Organic Growers</option>
                    <option>Tropic Traders</option>
                    <option>Fresh Farms</option>
                    <option>Dairy Land</option>
                    <option>Creamy Dairy</option>
                    <option>Grain House</option>
                    <option>Grocery Mart</option>
                    <option>Clean & Shine</option>
                    <option>Hygiene Hub</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="name">Your Name:</label>
            <div class="input-icon">
                <i class="fas fa-user"></i>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
        </div>

        <div class="form-group">
            <label for="review">Your Review:</label>
            <div class="input-icon">
                <i class="fas fa-pen"></i>
                <textarea id="review" placeholder="Write your feedback..." required></textarea>
            </div>
        </div>

        <button type="submit" class="submit-button">
            <i class="fas fa-paper-plane"></i> Submit Review
        </button>

        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i> Review submitted successfully!
            <div id="reviewList" style="margin-top: 30px;"></div>
        </div>
    </form>
</div>
</div>

<script src="{% static 'js/reviews.js' %}"></script>
</body>
</html>
