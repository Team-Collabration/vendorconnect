<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - VendorConnect</title>
{% load static %}
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Body */
body {
  font-family: 'Poppins', Arial, sans-serif;
  background: #f5f5dc; /* beige */
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding-top: 60px; /* navbar height */
}

/* Navbar */
.navbar {
  width: 100%;
  background: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 40px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1000;
  height: 60px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-text {
  font-size: 2rem; /* navbar text size */
  font-weight: bold;
  background: linear-gradient(90deg, rgb(30,114,211), rgb(54,186,82));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
}

.navbar .circle-logo {
  height: 2.5em;  /* scales with text */
  width: auto;
  border-radius: 50%;
  border: 2px solid #5DADE2;
  box-shadow: 0 2px 6px rgba(93,173,226,0.3);
  vertical-align: middle;
}

/* Navbar links */
.navbar ul {
  list-style: none;
  display: flex;
  gap: 1.5rem;
}

.navbar a {
  text-decoration: none;
  color: #333;
  font-weight: 500;
}

.navbar a:hover {
  color: #4a6cf7;
}

/* Login Wrapper */
.login-wrapper {
  display: flex;
  width: 100%;
  max-width: 1200px;
  background: white;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  min-height: 600px;
}

/* Left Side - Login Form */
.login-section {
  flex: 1;
  padding: 60px 50px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: #f8f9fa;
}

.login-section h2 {
  font-size: 28px;
  font-weight: 600;
  color: #2d3748;
  margin-bottom: 10px;
  text-align: center;
}

.login-subtitle {
  color: #718096;
  font-size: 14px;
  margin-bottom: 40px;
  text-align: center;
}

/* Form Styles */
form { width: 100%; }

.form-group { margin-bottom: 24px; }

.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  color: #4a5568;
  margin-bottom: 8px;
}

.form-group input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  font-size: 15px;
  font-family: 'Poppins', sans-serif;
  background: white;
  transition: all 0.3s ease;
}

.form-group input:focus {
  outline: none;
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}

.form-options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  font-size: 14px;
}

.remember-me {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #4a5568;
}

.remember-me input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
}

.login-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #667eea 0%, rgb(25,53,192) 100%);
  color: white;
  font-size: 16px;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(102,126,234,0.4);
}

.signup-link {
  text-align: center;
  margin-top: 24px;
  font-size: 14px;
  color: #4a5568;
}

.signup-link a {
  color: #667eea;
  text-decoration: none;
  font-weight: 600;
}

.signup-link a:hover { color: rgb(32,42,171); }

/* Right Side - Welcome Section */
.welcome-section {
  flex: 1;
  background: linear-gradient(135deg, #667eea 0%, rgb(24,59,136) 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
  padding: 40px;
}

.welcome-section h1 {
  font-size: 3rem; /* large text */
  font-weight: 700;
  margin-bottom: 15px;
}

.welcome-section p {
  font-size: 1.125rem;
  font-weight: 300;
  opacity: 0.95;
  max-width: 400px;
}

/* Welcome logo scales with h1 text */
.welcome-section .circle-logo {
  height: 8.0em; /* scales with heading */
  width: auto;
  border-radius: 50%;
  border: 2px solid #5DADE2;
  box-shadow: 0 2px 6px rgba(93,173,226,0.3);
  margin-bottom: 20px;
}

/* Responsive */
@media (max-width: 968px) {
  .login-wrapper { flex-direction: column; }
  .welcome-section { order: -1; min-height: 300px; }
  .welcome-section h1 { font-size: 2.2rem; }
  .navbar { padding: 1rem 2rem; }
  .navbar ul { flex-direction: column; gap: 1rem; }
}
</style>
</head>

<body>
<header>
  <nav class="navbar">
    <div class="logo">
      <img src="{% static 'logo.jpg' %}" alt="VendorConnect Logo" class="circle-logo">
      <h1 class="logo-text">VendorConnect</h1>
    </div>
    <ul>
      <li><a href="{% url 'index' %}">Home</a></li>
      <li><a href="{% url 'about' %}">About</a></li>
      <li><a href="{% url 'contact' %}">Contact</a></li>
    </ul>
  </nav>
</header>

<div class="login-wrapper">
  <!-- Left Side -->
  <div class="login-section">
    <h2>Login to Dashboard</h2>
    <p class="login-subtitle">Welcome back! Please enter your details</p>
    <form method="POST" action="{% url 'vendorlogin' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Type your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Type your password" required>
      </div>
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="remember">
          <span>Remember me</span>
        </label>
      </div>
      <button type="submit" class="login-btn">Login</button>
      <p class="signup-link">Don't have an account? <a href="{% url 'vendorsignup' %}">Sign up!</a></p>
    </form>
  </div>

  <!-- Right Side -->
  <div class="welcome-section">
    <img src="{% static 'logo.jpg' %}" alt="VendorConnect Logo" class="circle-logo">
    <h1>Welcome back to VendorConnect</h1>
    <p>Your secure gateway to reliable suppliers — where every purchase builds trust.</p>
  </div>
</div>
</body>
</html>
