
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supplier List</title>
    <link rel="stylesheet" href="{% static 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css' %}">
    {% load static %}
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #4a6cf7;
            margin-bottom: 30px;
        }

        ul.supplier-list {
            list-style: none;
            padding: 0;
        }

        ul.supplier-list li {
            background-color: #fdf5e6;
            padding: 12px 18px;
            margin: 8px 0;
            border-radius: 6px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        ul.supplier-list li i {
            color: #4a6cf7;
        }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fas fa-truck"></i> Supplier List</h2>
    <ul class="supplier-list">
        <li><i class="fas fa-store"></i> Green Basket</li>
        <li><i class="fas fa-seedling"></i> Green Valley</li>
        <li><i class="fas fa-warehouse"></i> Harvest Hub</li>
        <li><i class="fas fa-apple-alt"></i> Daily Fresh</li>
        <li><i class="fas fa-leaf"></i> Organic Growers</li>
        <li><i class="fas fa-store"></i> Tropic Traders</li>
        <li><i class="fas fa-tractor"></i> Fresh Farms</li>
        <li><i class="fas fa-mug-hot"></i> Dairy Land</li>
        <li><i class="fas fa-ice-cream"></i> Creamy Dairy</li>
        <li><i class="fas fa-bread-slice"></i> Grain House</li>
        <li><i class="fas fa-shopping-basket"></i> Grocery Mart</li>
        <li><i class="fas fa-spray-can"></i> Clean & Shine</li>
        <li><i class="fas fa-soap"></i> Hygiene Hub</li>
    </ul>
</div>

</body>
</html>
